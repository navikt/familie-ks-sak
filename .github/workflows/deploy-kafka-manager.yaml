name: Deploy familie-baks-kafka-manager

on:
  workflow_dispatch:
    inputs:
      deploy_to_prod:
        description: Deploy også til prod-gcp
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy familie-baks-kafka-manager til dev
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/kafka-manager/familie-baks-kafka-manager-dev.yaml
          VARS: .nais/kafka-manager/vars.yaml
      - name: Deploy familie-baks-kafka-manager til prod
        if: inputs.deploy_to_prod
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3

        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/kafka-manager/familie-baks-kafka-manager-prod.yaml
          VARS: .nais/kafka-manager/vars.yaml
